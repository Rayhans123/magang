<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>if(localStorage.getItem("jastip_theme")==="dark"||(!localStorage.getItem("jastip_theme")&&window.matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.classList.add("dark");</script>
    <title>Login - JastipPYTHA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-page">
    <div class="login-card">
      <div class="brand brand-center">
        <div class="brand-mark">J</div>
        <div>
          <b>Jastip<span>PYTHA</span></b
          ><small>Management System</small>
        </div>
      </div>
      <h1>Masuk ke Dashboard</h1>
      <p class="muted">Gunakan akun demo untuk mengakses sistem.</p>
      <form id="loginForm" class="form-stack">
        <label
          >Username<input
            id="username"
            required
            autocomplete="username"
            value="admin"
        /></label>
        <label
          >Password<input
            id="password"
            type="password"
            required
            autocomplete="current-password"
            value="admin123"
        /></label>
        <button class="btn btn-primary btn-block" type="submit">Masuk</button>
      </form>
      <div class="demo-hint">
        <b>Akun demo</b><br />Username: admin<br />Password: admin123
      </div>
      <div id="loginError" class="error-text"></div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/data-demo.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
